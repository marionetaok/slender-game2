<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030504">
  <title>SLENDER — The Eight Pages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="pages">PÁGINAS: 0 / 8</div>
    <div id="hint">WASD MOVER · SHIFT CORRER · F LINTERNA · RATÓN MIRAR</div>
    <div id="staminaWrap"><div id="stamina"></div></div>
    <div id="batteryWrap"><div id="battery"></div></div>
    <div id="batteryLabel">LINTERNA</div>
    <div id="crosshair"></div>
    <button id="fullscreen">⛶</button>
  </div>

  <div id="vignette"></div>
  <div id="static"></div>
  <div id="danger"></div>

  <section id="start" class="screen">
    <div class="panel">
      <div class="eyebrow">NIGHT FOREST</div>
      <h1>SLENDER</h1>
      <p>THE EIGHT PAGES</p>
      <div class="instructions">
        Encuentra las ocho páginas.<br>
        No dejes que él te encuentre.
      </div>
      <button id="startBtn">ENTRAR EN EL BOSQUE</button>
      <small>WASD · SHIFT · F · Ratón · ESC</small>
    </div>
  </section>

  <section id="end" class="screen hidden">
    <div class="panel">
      <div id="endTitle">TE ENCONTRÓ</div>
      <p id="endText"></p>
      <button id="restartBtn">VOLVER A JUGAR</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
